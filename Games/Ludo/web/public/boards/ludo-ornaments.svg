<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#b88936" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffe6a8" stop-opacity=".75"/>
    </linearGradient>
    <pattern id="beads" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M9 4 13 9 9 14 5 9Z" fill="url(#rail)" opacity=".6"/>
      <circle cx="9" cy="9" r="1.4" fill="#fff6d6" opacity=".55"/>
    </pattern>
    <g id="star">
      <path d="M0-11 3.2-3.5 11-3.5 4.8 1.4 7.1 9 0 4.5-7.1 9-4.8 1.4-11-3.5-3.2-3.5Z"
        fill="#fff8dc" fill-opacity=".92" stroke="#3a2a18" stroke-opacity=".45" stroke-width="1.2"/>
      <circle r="2" fill="#ffd257" fill-opacity=".85"/>
    </g>
    <g id="corner">
      <path d="M8 62C8 34 34 8 62 8M8 84C8 43 43 8 84 8" fill="none" stroke="url(#rail)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M18 58c14-2 23-11 26-25M58 18c-2 14-11 23-25 26" fill="none" stroke="#fff2c4" stroke-opacity=".5" stroke-width="1.4"/>
      <path d="M30 30c11 3 18 10 21 21" fill="none" stroke="url(#rail)" stroke-width="1.6"/>
      <circle cx="30" cy="30" r="3.2" fill="#fff2c4" fill-opacity=".65"/>
      <circle cx="62" cy="20" r="2.2" fill="#fff2c4" fill-opacity=".5"/>
      <circle cx="20" cy="62" r="2.2" fill="#fff2c4" fill-opacity=".5"/>
      <path d="M12 104c0-13 3-24 9-34M104 12c-13 0-24 3-34 9" fill="none" stroke="url(#rail)" stroke-opacity=".55" stroke-width="1.3"/>
    </g>
  </defs>

  <rect x="7" y="7" width="586" height="586" rx="24" fill="none" stroke="url(#rail)" stroke-width="2.2" opacity=".75"/>
  <rect x="14" y="14" width="572" height="572" rx="19" fill="none" stroke="#3a2a18" stroke-opacity=".28" stroke-width="1"/>

  <path d="M34 5h532M34 595h532" stroke="url(#beads)" stroke-width="9" opacity=".5"/>
  <path d="M5 34v532M595 34v532" stroke="url(#beads)" stroke-width="9" opacity=".5"/>

  <use href="#corner"/>
  <use href="#corner" transform="translate(600 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(0 600) scale(1 -1)"/>
  <use href="#corner" transform="translate(600 600) scale(-1 -1)"/>

  <g fill="none" stroke="url(#rail)" stroke-opacity=".55" stroke-width="1.3">
    <path d="M150 9c7 12 17 12 24 0m52 0c7 12 17 12 24 0m52 0c7 12 17 12 24 0m52 0c7 12 17 12 24 0"/>
    <path d="M150 591c7-12 17-12 24 0m52 0c7-12 17-12 24 0m52 0c7-12 17-12 24 0m52 0c7-12 17-12 24 0"/>
    <path d="M9 150c12 7 12 17 0 24m0 52c12 7 12 17 0 24m0 52c12 7 12 17 0 24m0 52c12 7 12 17 0 24"/>
    <path d="M591 150c-12 7-12 17 0 24m0 52c-12 7-12 17 0 24m0 52c-12 7-12 17 0 24m0 52c-12 7-12 17 0 24"/>
  </g>

  <!-- Safe-square stars, mapped from the 1920px board to this 600px overlay. -->
  <use href="#star" transform="translate(60 260)"/>
  <use href="#star" transform="translate(260 100)"/>
  <use href="#star" transform="translate(340 60)"/>
  <use href="#star" transform="translate(500 260)"/>
  <use href="#star" transform="translate(540 340)"/>
  <use href="#star" transform="translate(340 500)"/>
  <use href="#star" transform="translate(260 540)"/>
  <use href="#star" transform="translate(100 340)"/>
</svg>
